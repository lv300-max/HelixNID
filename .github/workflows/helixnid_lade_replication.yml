name: HELIXNID LaDe External Replication

on:
  push:
    paths:
      - 'HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/07_external_replication/**'
      - 'HELIXNID_EMPIRICAL_LANE_ONE/RUN_LADE_REPLICATION'
      - '.github/workflows/helixnid_lade_replication.yml'
  pull_request:
    paths:
      - 'HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/07_external_replication/**'
      - 'HELIXNID_EMPIRICAL_LANE_ONE/RUN_LADE_REPLICATION'
      - '.github/workflows/helixnid_lade_replication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-lade-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire real LaDe-D Jilin tasks and run chronological replication
        run: python HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/07_external_replication/lade_replication.py
      - name: Show LaDe replication certificate
        run: cat HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/07_external_replication/replication_certificate.json
      - name: Preserve LaDe replication package
        uses: actions/upload-artifact@v4
        with:
          name: helixnid-lade-real-replication
          path: HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/07_external_replication
