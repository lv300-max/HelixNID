name: HELIXNID Carrier Precision Final Release

on:
  push:
    paths:
      - 'HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/**'
      - 'HELIXNID_EMPIRICAL_LANE_ONE/RUN_FINAL_RELEASE'
      - '.github/workflows/helixnid_carrier_precision_final_release.yml'
  pull_request:
    paths:
      - 'HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/**'
      - 'HELIXNID_EMPIRICAL_LANE_ONE/RUN_FINAL_RELEASE'
      - '.github/workflows/helixnid_carrier_precision_final_release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout HELIXNID
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Product 1-6 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r HELIXNID_EMPIRICAL_LANE_ONE/requirements_product_1_4.txt
          python -m pip install -r HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/05_api/requirements.txt

      - name: Run Product 1-4
        run: python HELIXNID_EMPIRICAL_LANE_ONE/src/run_product_1_4.py

      - name: Validate Product 5-6
        run: python HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/validate_product_5_6.py

      - name: Run Product 7 LaDe independent replication
        run: python HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/07_external_replication/lade_replication.py

      - name: Run Product 8 Amazon operational benchmark
        run: python HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/08_amazon_operational/run_amazon_benchmark.py

      - name: Build Product 9-10 final release
        run: python HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/09_10_final_release/build_final_release.py

      - name: Show master release certificate
        run: cat HELIXNID_CARRIER_PRECISION_METER_V1/RELEASE_CERTIFICATE.json

      - name: Commit locked release outputs
        if: github.event_name == 'push'
        run: |
          git config user.name "HELIXNID Final Release Builder"
          git config user.email "actions@users.noreply.github.com"
          git add HELIXNID_EMPIRICAL_LANE_ONE/product_1_4 \
                  HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/PRODUCT_5_6_BUILD_CERTIFICATE.json \
                  HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/07_external_replication \
                  HELIXNID_EMPIRICAL_LANE_ONE/product_7_10/08_amazon_operational \
                  HELIXNID_CARRIER_PRECISION_METER_V1
          if git diff --cached --quiet; then
            echo "No generated release changes"
          else
            git commit -m "Lock HELIXNID Carrier Precision Meter V1 final release"
            git push
          fi
