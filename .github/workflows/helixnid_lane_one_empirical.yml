name: HELIXNID Lane One Real Empirical Benchmark

on:
  push:
    paths:
      - 'HELIXNID_EMPIRICAL_LANE_ONE/src/**'
      - 'HELIXNID_EMPIRICAL_LANE_ONE/README.md'
      - '.github/workflows/helixnid_lane_one_empirical.yml'
      - 'HELIXNID_EMPIRICAL_LANE_ONE/RUN_*'
  pull_request:
    paths:
      - 'HELIXNID_EMPIRICAL_LANE_ONE/**'
      - '.github/workflows/helixnid_lane_one_empirical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-empirical-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout HELIXNID
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire real Olist orders and run delivery-promise benchmark
        run: python HELIXNID_EMPIRICAL_LANE_ONE/src/helixnid_olist_eta_benchmark.py

      - name: Show Olist Carrier Precision certificate
        run: cat HELIXNID_EMPIRICAL_LANE_ONE/reports_olist_eta/release_certificate.json

      - name: Acquire real Amazon routes and run route benchmark
        run: python HELIXNID_EMPIRICAL_LANE_ONE/src/helixnid_last_mile_benchmark.py

      - name: Show Amazon route certificate
        run: cat HELIXNID_EMPIRICAL_LANE_ONE/reports/release_certificate.json

      - name: Commit real evidence package on main push
        if: github.event_name == 'push'
        run: |
          git config user.name "HELIXNID Empirical Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HELIXNID_EMPIRICAL_LANE_ONE/reports HELIXNID_EMPIRICAL_LANE_ONE/reports_olist_eta
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Lock Lane One real Olist and Amazon empirical results"
            git push
          fi
