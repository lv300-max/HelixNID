name: HELIXNID Carrier Precision Product 5-6

on:
  push:
    paths:
      - 'HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/**'
      - '.github/workflows/helixnid_product_5_6.yml'
  pull_request:
    paths:
      - 'HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/**'
      - '.github/workflows/helixnid_product_5_6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-product-5-6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout HELIXNID
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API dependencies
        run: python -m pip install -r HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/05_api/requirements.txt

      - name: Compile product source
        run: |
          python -m py_compile HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/05_api/app.py
          python -m py_compile HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/validate_product_5_6.py

      - name: Validate API and dashboard contract
        run: python HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/validate_product_5_6.py

      - name: Show build certificate
        run: cat HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/PRODUCT_5_6_BUILD_CERTIFICATE.json

      - name: Lock build certificate on main push
        if: github.event_name == 'push'
        run: |
          git config user.name "HELIXNID Product Builder"
          git config user.email "actions@users.noreply.github.com"
          git add HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/PRODUCT_5_6_BUILD_CERTIFICATE.json
          if git diff --cached --quiet; then
            echo "No certificate changes"
          else
            git commit -m "Lock HELIXNID Carrier Precision Product 5-6 build certificate"
            git push
          fi
