services:
  helixnid-precision-api:
    build:
      context: ../..
      dockerfile: HELIXNID_EMPIRICAL_LANE_ONE/product_5_6/05_api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HELIXNID_DB_PATH: /runtime/carrier_precision.db
      HELIXNID_MAX_BATCH: "10000"
      HELIXNID_CORS_ORIGINS: "*"
    volumes:
      - helixnid_runtime:/runtime
      - helixnid_model:/app/HELIXNID_EMPIRICAL_LANE_ONE/product_1_4/04_scoring_engine
      - helixnid_data:/app/HELIXNID_EMPIRICAL_LANE_ONE/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  helixnid-precision-dashboard:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./06_dashboard:/usr/share/nginx/html:ro
    depends_on:
      helixnid-precision-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  helixnid_runtime:
  helixnid_model:
  helixnid_data:
